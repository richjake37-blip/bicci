<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Journey App</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --danger: #ef4444;
            --success: #22c55e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            padding: 16px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            border-bottom: 1px solid #334155;
        }
        .container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 80px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        /* Floating Action Button for '+' missions */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            background-color: var(--accent);
            color: #0f172a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            border: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 100;
        }
        /* Navigation Tabs */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            display: flex;
            border-top: 1px solid #334155;
            height: 60px;
        }
        nav button {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
        }
        nav button.active {
            color: var(--accent);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #334155;
        }
        switch {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header id="app-header">Journey</header>

    <div class="container">
        <!-- Journey Tab -->
        <div id="tab-journey" class="tab-content active">
            <div id="missions-list">
                <!-- Dynamic missions load here -->
            </div>
        </div>

        <!-- Settings Tab -->
        <div id="tab-settings" class="tab-content">
            <h3>App Settings</h3>
            <div class="settings-row">
                <span>Lock Editing (Hide + Button)</span>
                <input type="checkbox" id="lock-toggle" style="width: 24px; height: 24px;">
            </div>
        </div>
    </div>

    <!-- Floating Action Button for adding missions -->
    <button id="add-btn" class="fab">+</button>

    <!-- Navigation Bar -->
    <nav>
        <button onclick="switchTab('journey')" id="nav-journey" class="active">Journey</button>
        <button onclick="switchTab('settings')" id="nav-settings">Settings</button>
    </nav>

    <!-- Firebase & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDCzREGTppRVjotb2VRBTqT9Z7BkzKaTvU",
          authDomain: "usapp-5bf73.firebaseapp.com",
          databaseURL: "https://usapp-5bf73-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "usapp-5bf73",
          storageBucket: "usapp-5bf73.firebasestorage.app",
          messagingSenderId: "430081006185",
          appId: "1:430081006185:web:b94e6adcd3f205692460f8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // References for sync state
        const settingsRef = ref(db, 'settings/locked');
        const missionsRef = ref(db, 'missions');

        const lockToggle = document.getElementById('lock-toggle');
        const addBtn = document.getElementById('add-btn');

        // Sync lock state from Firebase
        onValue(settingsRef, (snapshot) => {
            const isLocked = snapshot.val() || false;
            lockToggle.checked = isLocked;
            addBtn.style.display = isLocked ? 'none' : 'flex';
        });

        // When user toggles the lock in settings
        lockToggle.addEventListener('change', (e) => {
            set(settingsRef, e.target.checked);
        });

        // Add mission button action
        addBtn.addEventListener('click', () => {
            const title = prompt("Enter new mission:");
            if (title) {
                push(missionsRef, { title: title, completed: false });
            }
        });

        // Render live missions
        onValue(missionsRef, (snapshot) => {
            const list = document.getElementById('missions-list');
            list.innerHTML = '';
            const data = snapshot.val();
            if (data) {
                Object.values(data).forEach(mission => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerText = mission.title;
                    list.appendChild(div);
                });
            } else {
                list.innerHTML = '<div class="card">No active missions. Tap + to add one.</div>';
            }
        });
    </script>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('nav-' + tabName).classList.add('active');
            document.getElementById('app-header').innerText = tabName === 'journey' ? 'Journey' : 'Settings';
        }
    </script>
</body>
</html>
