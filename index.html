<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>us.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f1420;
    --navy-deep:#0a0e17;
    --cream:#f3ecdf;
    --rose:#e3a0ab;
    --rose-dim:#c98a96;
    --gold:#c8a35f;
    --line: rgba(243,236,223,0.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--navy-deep);
    color:var(--cream);
    font-family:'Jost', sans-serif;
    overflow:hidden;
    position:relative;
    -webkit-user-select:none;
    user-select:none;
  }
  #app{
    position:fixed; inset:0;
    overflow:hidden;
  }
  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity 900ms ease;
  }
  .screen.active{ opacity:1; pointer-events:auto; }

  /* ---------- background photo layer (shared by lock + countdown) ---------- */
  .photo-bg{
    position:absolute; inset:0;
    background-size:cover; background-position:center;
    background-color:#1a2033;
  }
  .photo-bg::after{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(10,14,23,0.55) 0%, rgba(10,14,23,0.35) 40%, rgba(10,14,23,0.75) 100%);
  }
  .photo-empty-hint{
    position:absolute; bottom:34px; left:50%; transform:translateX(-50%);
    font-size:12px; letter-spacing:.06em; color:rgba(243,236,223,0.55);
    font-family:'Jost',sans-serif; text-align:center; width:80%;
  }

  /* ---------- LOCK screen ---------- */
  #screen-lock .content{ position:relative; z-index:2; text-align:center; }
  .bracket-date{
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(28px, 7vw, 44px);
    letter-spacing:.12em;
    color:var(--cream);
    font-weight:500;
  }
  .enter-hint{
    margin-top:22px;
    font-family:'Jost', sans-serif;
    font-size:13px;
    letter-spacing:.18em;
    color:var(--rose);
    opacity:.9;
  }
  .enter-hint::before, .enter-hint::after{ content:"·"; margin:0 8px; color:var(--rose-dim); }
  .tap-pulse{
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:.55;} 50%{opacity:1;} }

  /* ---------- COUNTDOWN screen ---------- */
  #screen-countdown .content{ position:relative; z-index:2; text-align:center; }
  .small-date{
    font-family:'Cormorant Garamond', serif;
    font-size:15px; letter-spacing:.2em; color:rgba(243,236,223,0.7);
    margin-bottom:26px;
  }
  .countdown-days{
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(30px, 8vw, 48px);
    font-weight:500;
    letter-spacing:.08em;
  }
  .countdown-clock{
    margin-top:10px;
    font-family:'Jost', sans-serif;
    font-size:clamp(20px, 5.5vw, 28px);
    letter-spacing:.14em;
    color:var(--rose);
    font-variant-numeric: tabular-nums;
  }
  .lock-icon{ margin-top:30px; font-size:20px; opacity:.7; }

  /* ---------- REVEAL screen ---------- */
  #screen-reveal{ background: radial-gradient(120% 100% at 50% 30%, #1b2136 0%, var(--navy-deep) 70%); }
  .reveal-line1{
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(26px,6.4vw,40px);
    color:var(--rose);
    opacity:0; transform:translateY(10px);
    transition:opacity 1200ms ease, transform 1200ms ease;
  }
  .reveal-line2{
    margin-top:18px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:clamp(20px,5vw,28px);
    color:var(--cream);
    opacity:0; transform:translateY(10px);
    transition:opacity 1200ms ease, transform 1200ms ease;
  }
  .reveal-line1.show, .reveal-line2.show{ opacity:1; transform:translateY(0); }
  .reveal-enter{
    margin-top:44px; font-size:13px; letter-spacing:.18em; color:var(--gold);
    opacity:0; transition:opacity 900ms ease;
  }
  .reveal-enter.show{ opacity:.9; }

  /* ---------- MAIN app ---------- */
  #screen-main{ background:var(--navy); align-items:stretch; justify-content:flex-start; }
  .main-header{
    padding:26px 22px 14px;
    text-align:center;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .main-header h1{
    font-family:'Cormorant Garamond', serif; font-weight:500;
    font-size:26px; margin:0 0 4px;
    letter-spacing:.04em;
  }
  .main-header p{ margin:0; font-size:12px; letter-spacing:.1em; color:var(--rose); }
  .tabs{
    display:flex; gap:0; flex-shrink:0;
    border-bottom:1px solid var(--line);
    overflow-x:auto;
  }
  .tab-btn{
    flex:1; min-width:80px; text-align:center; padding:13px 6px;
    font-family:'Jost',sans-serif; font-size:12.5px; letter-spacing:.05em;
    color:rgba(243,236,223,0.5); background:none; border:none; cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .tab-btn.active{ color:var(--cream); border-bottom-color:var(--rose); }
  .tab-panels{ flex:1; overflow-y:auto; padding:22px 18px 100px; }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; animation: fadein 400ms ease; }
  @keyframes fadein{ from{opacity:0;} to{opacity:1;} }

  .empty-state{
    text-align:center; margin-top:60px; color:rgba(243,236,223,0.45);
    font-size:14px; line-height:1.6;
  }
  .empty-state span{ display:block; font-family:'Cormorant Garamond',serif; font-size:22px; color:var(--rose); margin-bottom:8px; }

  /* memory cards */
  .memory-card{
    background:#161c2c; border:1px solid var(--line); border-radius:2px;
    margin-bottom:16px; overflow:hidden;
  }
  .memory-card img{ width:100%; display:block; max-height:260px; object-fit:cover; }
  .memory-card .cap{ padding:12px 14px; }
  .memory-card .cap .txt{ font-size:14px; line-height:1.5; }
  .memory-card .cap .meta{ font-size:11px; color:rgba(243,236,223,0.4); margin-top:6px; letter-spacing:.05em; }

  /* notes */
  .note-card{
    border:1px solid var(--line); padding:16px; margin-bottom:14px;
    font-family:'Cormorant Garamond', serif; font-style:italic; font-size:17px; line-height:1.55;
    background:#161c2c; position:relative;
  }
  .note-card .meta{ font-family:'Jost',sans-serif; font-style:normal; font-size:11px; color:rgba(243,236,223,0.4); margin-top:10px; letter-spacing:.05em; }

  /* dates / places list */
  .list-item{
    display:flex; align-items:flex-start; gap:12px;
    border-bottom:1px solid var(--line);
    padding:14px 2px;
  }
  .list-item .dot{ width:6px; height:6px; border-radius:50%; background:var(--rose); margin-top:7px; flex-shrink:0; }
  .list-item .ttl{ font-size:15px; }
  .list-item .sub{ font-size:12px; color:rgba(243,236,223,0.45); margin-top:3px; }
  .tag{
    display:inline-block; font-size:10px; letter-spacing:.06em; padding:2px 7px;
    border:1px solid var(--rose-dim); color:var(--rose); margin-top:6px; border-radius:2px;
  }

  /* floating add button */
  .fab{
    position:fixed; right:20px; bottom:26px;
    width:52px; height:52px; border-radius:50%;
    background:var(--rose); color:var(--navy-deep);
    border:none; font-size:26px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,0.4);
    z-index:5;
  }

  /* modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,14,23,0.82);
    display:none; align-items:flex-end; justify-content:center; z-index:20;
  }
  .modal-backdrop.show{ display:flex; }
  .modal{
    background:var(--navy); width:100%; max-width:480px;
    border-top:1px solid var(--line);
    padding:22px 20px 28px; max-height:80vh; overflow-y:auto;
    animation: slideup 320ms ease;
  }
  @keyframes slideup{ from{ transform:translateY(30px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .modal h3{ font-family:'Cormorant Garamond',serif; font-weight:500; font-size:20px; margin:0 0 16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11px; letter-spacing:.06em; color:rgba(243,236,223,0.55); margin-bottom:6px; }
  .field input[type=text], .field input[type=date], .field textarea{
    width:100%; background:#161c2c; border:1px solid var(--line); color:var(--cream);
    padding:11px 12px; font-family:'Jost',sans-serif; font-size:14px; border-radius:2px;
    outline:none;
  }
  .field textarea{ min-height:80px; resize:vertical; font-family:'Cormorant Garamond',serif; font-size:16px; }
  .field input[type=file]{ color:rgba(243,236,223,0.6); font-size:12px; }
  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    padding:7px 13px; border:1px solid var(--line); border-radius:14px; font-size:12px;
    color:rgba(243,236,223,0.6); cursor:pointer; background:none;
  }
  .chip.selected{ border-color:var(--rose); color:var(--rose); }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .btn{
    flex:1; padding:13px; text-align:center; border:none; border-radius:2px;
    font-family:'Jost',sans-serif; font-size:13px; letter-spacing:.06em; cursor:pointer;
  }
  .btn-primary{ background:var(--rose); color:var(--navy-deep); }
  .btn-ghost{ background:none; color:rgba(243,236,223,0.55); border:1px solid var(--line); }

  /* settings gear (only visible on lock screen, tiny + unobtrusive) */
  .gear{
    position:absolute; top:16px; right:16px; z-index:3;
    width:34px; height:34px; border-radius:50%; border:none;
    background:rgba(10,14,23,0.35); color:rgba(243,236,223,0.7);
    font-size:15px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
</style>
</head>
<body>

<div id="app">

  <!-- STAGE 1 — LOCK -->
  <div class="screen active" id="screen-lock">
    <div class="photo-bg" id="bg-lock"></div>
    <button class="gear" id="gearBtn" title="Set up">⚙</button>
    <div class="content">
      <div class="bracket-date" id="lockDateText">[ 20 / 09 / 16 ]</div>
      <div class="enter-hint tap-pulse" id="enterHint">enter</div>
    </div>
    <div class="photo-empty-hint" id="photoHint" style="display:none;">tap ⚙ to add your photo &amp; set the date</div>
  </div>

  <!-- STAGE 2 — COUNTDOWN -->
  <div class="screen" id="screen-countdown">
    <div class="photo-bg" id="bg-countdown"></div>
    <div class="content">
      <div class="small-date" id="cdDateText">20 · 09 · 16</div>
      <div class="countdown-days" id="cdDays">[ — DAYS ]</div>
      <div class="countdown-clock" id="cdClock">[ 00 : 00 : 00 ]</div>
      <div class="lock-icon">🔒</div>
    </div>
  </div>

  <!-- STAGE 3 — REVEAL -->
  <div class="screen" id="screen-reveal">
    <div class="reveal-line1" id="revealLine1">❤ Happy anniversary ❤</div>
    <div class="reveal-line2" id="revealLine2">I love you.</div>
    <div class="reveal-enter tap-pulse" id="revealEnter">enter</div>
  </div>

  <!-- STAGE 4 — MAIN APP -->
  <div class="screen" id="screen-main">
    <div class="main-header">
      <h1 id="mainTitle">us.</h1>
      <p id="mainSub">together since 20 · 09 · 2016</p>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="memories">Memories</button>
      <button class="tab-btn" data-tab="notes">Notes</button>
      <button class="tab-btn" data-tab="dates">Our Dates</button>
      <button class="tab-btn" data-tab="places">Places</button>
    </div>
    <div class="tab-panels">
      <div class="tab-panel active" id="panel-memories"></div>
      <div class="tab-panel" id="panel-notes"></div>
      <div class="tab-panel" id="panel-dates"></div>
      <div class="tab-panel" id="panel-places"></div>
    </div>
    <button class="fab" id="fabBtn">+</button>
  </div>

</div>

<!-- MODALS -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalContent"></div>
</div>

<script>
(function(){

  // ---------- storage helpers ----------
  const KEY = 'us_app_state_v1';
  function loadState(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return {
      annivDate: '2016-09-20', // ISO, year is arbitrary — only month/day used for the yearly countdown
      photo: null,
      stage: 'lock', // lock | countdown | reveal | main
      memories: [],
      notes: [],
      dates: [],
      places: []
    };
  }
  let state = loadState();
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){
      console.warn('storage save failed', e);
    }
  }

  // ---------- date helpers ----------
  function annivMonthDay(){
    const d = new Date(state.annivDate + 'T00:00:00');
    return { month: d.getMonth(), day: d.getDate() };
  }
  function nextAnniversary(){
    const {month, day} = annivMonthDay();
    const now = new Date();
    let target = new Date(now.getFullYear(), month, day, 0,0,0,0);
    if(target.getTime() <= now.getTime()){
      target = new Date(now.getFullYear()+1, month, day, 0,0,0,0);
    }
    return target;
  }
  function formatBracketDate(){
    const d = new Date(state.annivDate + 'T00:00:00');
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const yy = String(d.getFullYear()).slice(-2);
    return `[ ${dd} / ${mm} / ${yy} ]`;
  }
  function formatDotDate(){
    const d = new Date(state.annivDate + 'T00:00:00');
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    return `${dd} · ${mm} · ${d.getFullYear()}`;
  }

  // ---------- screens ----------
  const screens = {
    lock: document.getElementById('screen-lock'),
    countdown: document.getElementById('screen-countdown'),
    reveal: document.getElementById('screen-reveal'),
    main: document.getElementById('screen-main'),
  };
  function showScreen(name){
    Object.values(screens).forEach(s=>s.classList.remove('active'));
    screens[name].classList.add('active');
    state.stage = name;
    save();
  }

  function applyPhoto(){
    const url = state.photo;
    ['bg-lock','bg-countdown'].forEach(id=>{
      const el = document.getElementById(id);
      el.style.backgroundImage = url ? `url(${url})` : 'none';
    });
    document.getElementById('photoHint').style.display = url ? 'none' : 'block';
  }

  function renderLock(){
    document.getElementById('lockDateText').textContent = formatBracketDate();
  }

  let countdownTimer = null;
  function renderCountdown(){
    document.getElementById('cdDateText').textContent = formatDotDate();
    function tick(){
      const target = nextAnniversary();
      const now = new Date();
      let diff = target - now;
      if(diff <= 0){
        clearInterval(countdownTimer);
        goReveal();
        return;
      }
      const days = Math.floor(diff/86400000);
      diff -= days*86400000;
      const hrs = Math.floor(diff/3600000);
      diff -= hrs*3600000;
      const mins = Math.floor(diff/60000);
      diff -= mins*60000;
      const secs = Math.floor(diff/1000);
      document.getElementById('cdDays').textContent = `[ ${days} DAY${days===1?'':'S'} ]`;
      document.getElementById('cdClock').textContent =
        `[ ${String(hrs).padStart(2,'0')} : ${String(mins).padStart(2,'0')} : ${String(secs).padStart(2,'0')} ]`;
    }
    tick();
    if(countdownTimer) clearInterval(countdownTimer);
    countdownTimer = setInterval(tick, 1000);
  }

  function goCountdown(){
    showScreen('countdown');
    renderCountdown();
  }
  function goReveal(){
    showScreen('reveal');
    const l1 = document.getElementById('revealLine1');
    const l2 = document.getElementById('revealLine2');
    const en = document.getElementById('revealEnter');
    [l1,l2,en].forEach(el=>el.classList.remove('show'));
    setTimeout(()=>l1.classList.add('show'), 300);
    setTimeout(()=>l2.classList.add('show'), 1500);
    setTimeout(()=>en.classList.add('show'), 2600);
  }
  function goMain(){
    showScreen('main');
    document.getElementById('mainSub').textContent = 'together since ' + formatDotDate();
    renderAll();
  }

  // tap handlers
  document.getElementById('screen-lock').addEventListener('click', function(e){
    if(e.target.id === 'gearBtn') return;
    goCountdown();
  });
  document.getElementById('screen-reveal').addEventListener('click', goMain);

  // gear / settings
  document.getElementById('gearBtn').addEventListener('click', function(e){
    e.stopPropagation();
    openSettingsModal();
  });

  // ---------- tabs ----------
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    });
  });

  // ---------- render lists ----------
  function esc(s){
    const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML;
  }
  function renderAll(){ renderMemories(); renderNotes(); renderDates(); renderPlaces(); }

  function renderMemories(){
    const p = document.getElementById('panel-memories');
    if(!state.memories.length){
      p.innerHTML = `<div class="empty-state"><span>no memories yet</span>add your first photo together</div>`;
      return;
    }
    p.innerHTML = state.memories.slice().reverse().map(m=>`
      <div class="memory-card">
        ${m.photo ? `<img src="${m.photo}">` : ''}
        <div class="cap">
          <div class="txt">${esc(m.caption)}</div>
          ${m.date ? `<div class="meta">${esc(m.date)}</div>` : ''}
        </div>
      </div>`).join('');
  }
  function renderNotes(){
    const p = document.getElementById('panel-notes');
    if(!state.notes.length){
      p.innerHTML = `<div class="empty-state"><span>no notes yet</span>leave something for her to find</div>`;
      return;
    }
    p.innerHTML = state.notes.slice().reverse().map(n=>`
      <div class="note-card">
        "${esc(n.text)}"
        <div class="meta">${esc(n.date||'')}</div>
      </div>`).join('');
  }
  function renderDates(){
    const p = document.getElementById('panel-dates');
    if(!state.dates.length){
      p.innerHTML = `<div class="empty-state"><span>no dates yet</span>log one you've had, or plan one ahead</div>`;
      return;
    }
    p.innerHTML = state.dates.slice().reverse().map(d=>`
      <div class="list-item">
        <div class="dot"></div>
        <div>
          <div class="ttl">${esc(d.title)}</div>
          ${d.when ? `<div class="sub">${esc(d.when)}</div>` : ''}
          <span class="tag">${d.type==='idea' ? 'idea' : 'happened'}</span>
        </div>
      </div>`).join('');
  }
  function renderPlaces(){
    const p = document.getElementById('panel-places');
    if(!state.places.length){
      p.innerHTML = `<div class="empty-state"><span>no places yet</span>save somewhere you've been or want to go</div>`;
      return;
    }
    p.innerHTML = state.places.slice().reverse().map(pl=>`
      <div class="list-item">
        <div class="dot"></div>
        <div>
          <div class="ttl">${esc(pl.name)}</div>
          ${pl.note ? `<div class="sub">${esc(pl.note)}</div>` : ''}
          <span class="tag">${pl.visited ? 'been there' : 'want to go'}</span>
        </div>
      </div>`).join('');
  }

  // ---------- modal system ----------
  const backdrop = document.getElementById('modalBackdrop');
  const modalContent = document.getElementById('modalContent');
  function closeModal(){ backdrop.classList.remove('show'); modalContent.innerHTML=''; }
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) closeModal(); });

  function fileToDataUrl(file, cb){
    const reader = new FileReader();
    reader.onload = ()=>cb(reader.result);
    reader.readAsDataURL(file);
  }

  document.getElementById('fabBtn').addEventListener('click', ()=>{
    const active = document.querySelector('.tab-btn.active').dataset.tab;
    if(active==='memories') openMemoryModal();
    if(active==='notes') openNoteModal();
    if(active==='dates') openDateModal();
    if(active==='places') openPlaceModal();
  });

  function openMemoryModal(){
    modalContent.innerHTML = `
      <h3>Add a memory</h3>
      <div class="field"><label>Photo</label><input type="file" id="mPhoto" accept="image/*"></div>
      <div class="field"><label>Caption</label><textarea id="mCaption" placeholder="What made this one worth keeping?"></textarea></div>
      <div class="field"><label>When (optional)</label><input type="text" id="mDate" placeholder="e.g. summer 2024, or a date"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="mCancel">Cancel</button>
        <button class="btn btn-primary" id="mSave">Save</button>
      </div>`;
    backdrop.classList.add('show');
    document.getElementById('mCancel').onclick = closeModal;
    document.getElementById('mSave').onclick = ()=>{
      const capEl = document.getElementById('mCaption');
      const fileEl = document.getElementById('mPhoto');
      const dateEl = document.getElementById('mDate');
      const finish = (photoUrl)=>{
        if(!capEl.value.trim() && !photoUrl){ closeModal(); return; }
        state.memories.push({ caption: capEl.value.trim(), date: dateEl.value.trim(), photo: photoUrl||null });
        save(); renderMemories(); closeModal();
      };
      if(fileEl.files && fileEl.files[0]){ fileToDataUrl(fileEl.files[0], finish); }
      else { finish(null); }
    };
  }

  function openNoteModal(){
    modalContent.innerHTML = `
      <h3>Leave a note</h3>
      <div class="field"><label>Your note</label><textarea id="nText" placeholder="Something you want her to read..."></textarea></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="nCancel">Cancel</button>
        <button class="btn btn-primary" id="nSave">Save</button>
      </div>`;
    backdrop.classList.add('show');
    document.getElementById('nCancel').onclick = closeModal;
    document.getElementById('nSave').onclick = ()=>{
      const t = document.getElementById('nText').value.trim();
      if(!t){ closeModal(); return; }
      state.notes.push({ text:t, date: new Date().toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}) });
      save(); renderNotes(); closeModal();
    };
  }

  function openDateModal(){
    let type = 'happened';
    modalContent.innerHTML = `
      <h3>Add a date</h3>
      <div class="field"><label>Title</label><input type="text" id="dTitle" placeholder="e.g. dinner at that little Italian place"></div>
      <div class="field"><label>When</label><input type="text" id="dWhen" placeholder="e.g. 14 Feb, or 'sometime in spring'"></div>
      <div class="field"><label>Type</label>
        <div class="chip-row">
          <button class="chip selected" id="chipHappened" type="button">Happened</button>
          <button class="chip" id="chipIdea" type="button">Idea</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="dCancel">Cancel</button>
        <button class="btn btn-primary" id="dSave">Save</button>
      </div>`;
    backdrop.classList.add('show');
    document.getElementById('chipHappened').onclick = ()=>{ type='happened'; document.getElementById('chipHappened').classList.add('selected'); document.getElementById('chipIdea').classList.remove('selected'); };
    document.getElementById('chipIdea').onclick = ()=>{ type='idea'; document.getElementById('chipIdea').classList.add('selected'); document.getElementById('chipHappened').classList.remove('selected'); };
    document.getElementById('dCancel').onclick = closeModal;
    document.getElementById('dSave').onclick = ()=>{
      const title = document.getElementById('dTitle').value.trim();
      if(!title){ closeModal(); return; }
      state.dates.push({ title, when: document.getElementById('dWhen').value.trim(), type });
      save(); renderDates(); closeModal();
    };
  }

  function openPlaceModal(){
    let visited = false;
    modalContent.innerHTML = `
      <h3>Add a place</h3>
      <div class="field"><label>Name</label><input type="text" id="pName" placeholder="e.g. that beach in Cornwall"></div>
      <div class="field"><label>Note</label><input type="text" id="pNote" placeholder="why it matters, or what to do there"></div>
      <div class="field"><label>Status</label>
        <div class="chip-row">
          <button class="chip" id="chipWant" type="button">Want to go</button>
          <button class="chip" id="chipBeen" type="button">Been there</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="pCancel">Cancel</button>
        <button class="btn btn-primary" id="pSave">Save</button>
      </div>`;
    backdrop.classList.add('show');
    document.getElementById('chipWant').classList.add('selected');
    document.getElementById('chipWant').onclick = ()=>{ visited=false; document.getElementById('chipWant').classList.add('selected'); document.getElementById('chipBeen').classList.remove('selected'); };
    document.getElementById('chipBeen').onclick = ()=>{ visited=true; document.getElementById('chipBeen').classList.add('selected'); document.getElementById('chipWant').classList.remove('selected'); };
    document.getElementById('pCancel').onclick = closeModal;
    document.getElementById('pSave').onclick = ()=>{
      const name = document.getElementById('pName').value.trim();
      if(!name){ closeModal(); return; }
      state.places.push({ name, note: document.getElementById('pNote').value.trim(), visited });
      save(); renderPlaces(); closeModal();
    };
  }

  // ---------- settings modal (photo + date + preview + reset) ----------
  function openSettingsModal(){
    modalContent.innerHTML = `
      <h3>Set up</h3>
      <div class="field"><label>Background photo</label><input type="file" id="sPhoto" accept="image/*"></div>
      <div class="field"><label>Anniversary date</label><input type="date" id="sDate" value="${state.annivDate}"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="sCancel">Close</button>
        <button class="btn btn-primary" id="sSave">Save</button>
      </div>
      <div style="margin-top:22px; border-top:1px solid var(--line); padding-top:16px;">
        <div class="field" style="margin-bottom:10px;"><label>While building (only you see this)</label></div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="sPreview">Preview reveal</button>
          <button class="btn btn-ghost" id="sBackLock">Back to lock</button>
        </div>
      </div>`;
    backdrop.classList.add('show');
    document.getElementById('sCancel').onclick = closeModal;
    document.getElementById('sSave').onclick = ()=>{
      const fileEl = document.getElementById('sPhoto');
      state.annivDate = document.getElementById('sDate').value || state.annivDate;
      const finish = ()=>{
        save(); applyPhoto(); renderLock(); closeModal();
      };
      if(fileEl.files && fileEl.files[0]){
        fileToDataUrl(fileEl.files[0], (url)=>{ state.photo = url; finish(); });
      } else { finish(); }
    };
    document.getElementById('sPreview').onclick = ()=>{ closeModal(); goReveal(); };
    document.getElementById('sBackLock').onclick = ()=>{ closeModal(); showScreen('lock'); renderLock(); };
  }

  // ---------- init ----------
  applyPhoto();
  renderLock();
  // always start on lock screen when the app is opened, so the surprise resets each visit —
  // but everything you've already added (memories/notes/dates/places/photo) is remembered.
  showScreen('lock');

})();
</script>
</body>
</html>
